<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Alchemist's Tap | Artisan Craft Beer Ingredients & Kits</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        canvasBg: '#faf8f5',
                        surfaceCard: '#ffffff',
                        surfaceSubtle: '#f3efe6',
                        espressoText: '#1c1917',
                        mutedText: '#78716c',
                        amberGold: '#d97706',
                        copper: '#c2410c',
                        emeraldHops: '#059669',
                        borderSubtle: '#e7e2d5'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="./css/main.css">
</head>
<body class="selection:bg-amber-200 selection:text-espressoText transition-colors duration-300">
    <!-- Notification Toast Message Box -->
    <div id="toast" class="sticky  bottom-8 z-9999 ltr:right-8 rtl:left-8 z-50 transform translate-y-32 opacity-0 transition-all duration-300 bg-espressoText dark:bg-stone-800 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center space-x-3 rtl:space-x-reverse border border-amber-500/30">
        <i class="fa-solid fa-sparkles text-amber-400 shrink-0"></i>
        <div>
            <h4 id="toast-title" class="font-bold text-sm font-display">Success</h4>
            <p id="toast-desc" class="text-xs text-stone-300">Action processed successfully.</p>
        </div>
    </div>
    <!-- Dynamic Header Injector Container -->
    <div id="app-header-container"></div>
    <!-- Main Content Container with Dynamic Views -->
    <main class="min-h-screen pt-32 pb-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" id="app-view-container"></main>
    <!-- Slide-Over Shopping Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-stone-900/40 backdrop-blur-sm transition-opacity" onclick="closeCartDrawer()"></div>
        <div class="absolute inset-y-0 ltr:right-0 rtl:left-0 max-w-md w-full bg-white dark:bg-stone-900 border-x ltr:border-l rtl:border-r border-stone-200 dark:border-stone-800 shadow-2xl flex flex-col">
            <div class="p-6 border-b border-stone-200 dark:border-stone-800 flex items-center justify-between">
                <div class="flex items-center space-x-3 rtl:space-x-reverse">
                    <i class="fa-solid fa-bag-shopping text-amber-600 text-lg"></i>
                    <h3 class="font-display font-bold text-lg text-espressoText dark:text-white">Your Brew Cart</h3>
                </div>
                <button onclick="closeCartDrawer()" class="p-2 rounded-xl text-stone-500 hover:text-stone-900 dark:hover:text-white hover:bg-stone-100 dark:hover:bg-stone-800">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
            <div class="p-6 border-t border-stone-200 dark:border-stone-800 bg-stone-50 dark:bg-stone-800/50 space-y-4">
                <div class="flex items-center justify-between text-stone-600 dark:text-stone-400 text-sm">
                    <span>Subtotal</span>
                    <span id="cart-subtotal" class="font-bold text-espressoText dark:text-white text-base">$0.00</span>
                </div>
                <div class="pt-2 border-t border-stone-200 dark:border-stone-700 flex items-center justify-between">
                    <span class="font-display font-bold text-espressoText dark:text-white text-lg">Total</span>
                    <span id="cart-total" class="font-display font-bold text-amber-600 text-2xl">$0.00</span>
                </div>
                <button onclick="checkoutCart()" class="w-full py-4 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-extrabold text-sm tracking-wider uppercase shadow-lg shadow-amber-600/20 transition-all flex items-center justify-center space-x-2 rtl:space-x-reverse">
                    <i class="fa-solid fa-lock"></i>
                    <span>Secure Checkout</span>
                </button>
            </div>
        </div>
    </div>
    <!-- Dynamic Footer Injector Container -->
    <div id="app-footer-container"></div>
    <!-- Main JavaScript Logic -->
    <script src="./js/main.js"></script>
</body>
</html>
